name: CI/CD Pipeline - Lint, Type Check & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Development Dependencies
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify Dependency Graph
        run: python -m pip check

      - name: Check Formatting
        run: ruff format --check src tests

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run Mypy Static Type Checker
        run: mypy src

      - name: Run Pytest Test Suite
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Upload Coverage XML to GitHub Artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
